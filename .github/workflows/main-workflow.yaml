name: Main-Workflow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  actions: read
  pull-requests: read

env:
   PKGCACHE_HTTP_VERSION: "1.1"

jobs:
  test_firewall_2025_vs2026:
    runs-on: windows-2025-vs2026
    steps:
      - name: Network diagnostic (temporary)
        shell: pwsh
        run: |
          Resolve-DnsName api.github.com
          curl.exe -v https://api.github.com/zen
          curl.exe -s https://api.ipify.org   # shows the outbound IP

  test_firewall_2025:
    runs-on: windows-2025
    steps:
      - name: Network diagnostic (temporary)
        shell: pwsh
        run: |
          Resolve-DnsName api.github.com
          curl.exe -v https://api.github.com/zen
          curl.exe -s https://api.ipify.org   # shows the outbound IP
  
  R-CMD-Check:
    if: ${{ !cancelled() }}
    permissions: read-all
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/R-CMD-check-build.yaml@main

