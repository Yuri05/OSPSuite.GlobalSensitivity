name: Main-Workflow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  actions: read
  pull-requests: read

jobs:
  test_firewall_2025_vs2026:
    runs-on: windows-2025-vs2026
    steps:
      - name: Network diagnostic (temporary)
        shell: pwsh
        run: |
          Resolve-DnsName api.github.com
          curl.exe -v https://api.github.com/zen
          curl.exe -s https://api.ipify.org   # shows the outbound IP

  test_firewall_2025:
    runs-on: windows-2025
    steps:
      - name: Network diagnostic (temporary)
        shell: pwsh
        run: |
          Resolve-DnsName api.github.com
          curl.exe -v https://api.github.com/zen
          curl.exe -s https://api.ipify.org   # shows the outbound IP
  
  bump-dev-version:
    if: github.event_name != 'pull_request'
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/bump_dev_version_tag_branch.yaml@main
    with:
      app-id: ${{ vars.VERSION_BUMPER_APPID }}
    secrets:
      private-key: ${{ secrets.VERSION_BUMPER_SECRET }}

  R-CMD-Check:
    needs: bump-dev-version
    if: ${{ !cancelled() }}
    permissions: read-all
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/R-CMD-check-build.yaml@main

  pkgdown:
    needs: bump-dev-version
    if: ${{ !cancelled() }}
    uses:  Open-Systems-Pharmacology/Workflows/.github/workflows/pkgdown.yaml@main
